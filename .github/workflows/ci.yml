# Runs the same three commands the README tells a person to run, on every push
# and every pull request. Nothing here is a check the repository does not
# already hold itself to locally — CI only makes it impossible to forget one.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, lint and types: one node, since none of the three can depend on
  # which version is running them.
  check:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  # The suite, on both ends of what package.json claims to support. The editor
  # runs in a browser, but everything below it is meant to run under plain Node
  # and inside a Worker, so the floor is worth testing rather than asserting.
  #
  # The floor is 22 because pnpm 11 reads its store through node:sqlite, which
  # Node 20 does not have — on 20 the package manager crashes before installing
  # anything, so there is no version of this repository a Node 20 could build.
  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The two things this repository actually ships, built.
  #
  # Neither is covered by the suite above: the tests import TypeScript source
  # directly, so a bundle that will not build and a desktop shell that will not
  # compile both pass every one of them. Both have broken here before — a stale
  # import, a watcher that took the dev server down — and each time the first
  # thing to notice was a person running it by hand.
  #
  # `cargo check` rather than a full build: what is worth catching is source
  # that does not compile, and linking a release binary to find that out costs
  # five minutes for no more information. The web bundle is built for real,
  # because bundling is where its failures live.
  build:
    name: The bundle and the desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the editor for production
        run: pnpm --filter @typewright/editor build

      # What a browser would be served, and what the desktop shell embeds. An
      # empty one means the build reported success and produced nothing.
      - name: Check something came out
        run: |
          test -f apps/editor/dist/index.html
          test -n "$(ls apps/editor/dist/assets)"

      # The shell is Rust against the system webview, so on Linux it wants
      # webkit's headers to compile at all. None of this is needed to *run* the
      # editor; it is the price of checking the shell on a machine that is not
      # the one it is built for.
      - name: The libraries the webview binds to
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/editor/src-tauri/target
          key: cargo-${{ hashFiles('apps/editor/src-tauri/Cargo.lock') }}
          restore-keys: cargo-

      - name: Check the desktop shell compiles
        run: cargo check --manifest-path apps/editor/src-tauri/Cargo.toml

  # A UFO that only this repository has ever read proves consistency, not
  # correctness: a misreading of the format shared by our writer and our reader
  # passes every test in the suite. fontTools is the reference implementation
  # the type world is built on, and it exists only in Python — which is the
  # whole reason there is a Python step in a TypeScript repository.
  ufo:
    name: UFO against fontTools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ufo-check/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r tools/ufo-check/requirements.txt

      - name: Export the proof font
        run: UFO_OUT="$RUNNER_TEMP/ufo" pnpm --filter @typewright/font-io exec vitest run proof-ufo

      - name: Read it with fontTools
        run: python tools/ufo-check/check_ufo.py "$RUNNER_TEMP/ufo/TunniProof-SemiboldItalic.ufo"

      - name: Have fontTools write the whole font back
        run: >
          python tools/ufo-check/rewrite_ufo.py
          "$RUNNER_TEMP/ufo/TunniProof-SemiboldItalic.ufo"
          "$RUNNER_TEMP/ufo/FromFontTools.ufo"
          "$RUNNER_TEMP/ufo/FromFontTools.ufo.zip"

      # The only test here whose input was written by something other than us.
      - name: Read back what fontTools wrote
        run: FOREIGN_UFO="$RUNNER_TEMP/ufo/FromFontTools.ufo.zip" pnpm --filter @typewright/font-io exec vitest run proof-ufo

      - name: Export the proof family
        run: FAMILY_OUT="$RUNNER_TEMP/family" pnpm --filter @typewright/font-io exec vitest run family

      # A designspace is a document about files, and the failure it makes
      # possible — naming a UFO that is not beside it — is invisible to anything
      # that only reads what we wrote.
      - name: Read it with fontTools
        run: python tools/ufo-check/check_family.py "$RUNNER_TEMP/family/Chalk.designspace"

      - name: Export the mark-attachment proof font
        run: OTF_OUT="$RUNNER_TEMP/otf" pnpm --filter @typewright/font-io exec vitest run proof-otf

      - name: Export both flavours of the proof font
        run: TRUETYPE_OUT="$RUNNER_TEMP/ttf" pnpm --filter @typewright/font-io exec vitest run truetype

      # A cubic cannot be written as quadratics exactly, so the only question is
      # how close — and the arithmetic that would measure it here is the
      # arithmetic that did the converting. fontTools draws both flavours of the
      # same drawing and the two outlines are compared as shapes.
      - name: Compare the quadratic outlines with the cubic ones
        run: python tools/otf-check/check_ttf.py "$RUNNER_TEMP/ttf/Quad.ttf" "$RUNNER_TEMP/ttf/Quad.otf"

      - name: Export the variable proof font
        run: VARIABLE_OUT="$RUNNER_TEMP/vf" pnpm --filter @typewright/font-io exec vitest run variable

      # The one check this repository cannot make of itself: whether the deltas
      # are right. The arithmetic that would verify them here is the arithmetic
      # that wrote them, so fontTools pins the font at each master's location
      # and the outlines are compared with what that master was drawn as.
      - name: Instantiate it at every master
        run: python tools/otf-check/check_vf.py "$RUNNER_TEMP/vf/Vary.otf" "$RUNNER_TEMP/vf/masters.json"

      # The same question of the other flavour, and it cannot be asked the same
      # way: quadratic outlines have no points in common with the cubic drawing,
      # so each instance is compared with that master compiled on its own as a
      # static TrueType font — as shapes, which is the only comparison there is.
      - name: Instantiate the TrueType flavour at every master
        run: >
          python tools/otf-check/check_vf_ttf.py
          "$RUNNER_TEMP/vf/Vary.ttf" "$RUNNER_TEMP/vf/masters.json" "$RUNNER_TEMP/vf"

      # Three masters on one axis, which is what makes a region intermediate —
      # a tuple that has to write its start and end rather than let them be
      # implied. Two masters never produce one, so the proof font alone would
      # leave that branch of the writer unexercised.
      - name: Instantiate a three-master TrueType at every master
        run: >
          python tools/otf-check/check_vf_ttf.py
          "$RUNNER_TEMP/vf/Three.ttf" "$RUNNER_TEMP/vf/three.json" "$RUNNER_TEMP/vf"

      - name: Read its GPOS with fontTools
        run: python tools/otf-check/check_otf.py "$RUNNER_TEMP/otf/TunniMarks-SemiboldItalic.otf"
