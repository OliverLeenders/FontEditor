# What is too slow to run on every push, run once a night.
#
# Two things in this repository are asked for by a variable and skipped
# otherwise, because each is minutes: every stroke the tests draw held against
# the pen swept along its path, where a push asks it of a handful; and the
# store walked at random for six hundred fonts' worth of edits, where a push
# walks sixty. Skipped and never run, a check is a check nobody has — which is
# what both were until somebody remembered to ask. Here they are asked every
# night, and from the Actions tab whenever somebody wants to know now.
#
# And how much of the source the tests run at all, which is the suite once
# more with every line counted, and several times as slow for it.
#
# A night that fails does not stop anything: nothing is waiting on it. It is
# there to be looked at, and a failure here is a fault that the push that made
# it was let past.

name: Nightly

on:
  schedule:
    # Three in the morning, UTC: after a day's pushes, and on nobody's time.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Every stroke case, in both the packages that draw them: the line round the
  # ink against the swept pen, and the outline a font gets against the canvas's.
  strokes:
    name: Every stroke, against the pen
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STROKE_DIAGNOSE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The line round the ink, in geometry
        run: pnpm --filter @typewright/geometry test
      # Run whether or not the first found something: they ask different
      # things, and a night should say all that is wrong.
      - name: The outline a font gets, in font-model
        if: ${{ !cancelled() }}
        run: pnpm --filter @typewright/font-model test

  # Whether what is planned for a variable font is the ink, every stroke of the
  # census in two masters: how many leave ink out, held to what it was. See
  # packages/geometry/test/accuracy. In shards side by side, an hour and more.
  accuracy:
    name: The ink planned for a variable font
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STROKE_ACCURACY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @typewright/geometry exec vitest run test/accuracy

  # How much of each package's source its own tests run, as a table in this
  # job's summary, and held against the floor each package was given: see
  # tools/coverage.
  #
  # A job to each package, side by side: the ones that draw strokes and compile
  # fonts are an hour and more of this each, and one after another they would
  # be most of a night.
  packages:
    name: Which packages there are
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: list
        run: echo "list=$(node tools/coverage/coverage.mjs --list)" >> "$GITHUB_OUTPUT"

  coverage:
    name: What the tests run of ${{ matrix.package }}
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/coverage/coverage.mjs --check ${{ matrix.package }}

  # The store, walked at random for much longer than a push walks it.
  walk:
    name: The long random walk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WALK_SEEDS: "600"
      WALK_STEPS: "90"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm --filter @typewright/editor exec vitest run
          test/random-walk.test.ts --testTimeout=1800000
